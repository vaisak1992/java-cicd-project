
name: 03 - Maven Publish and EC2 Deployment

on:
  workflow_run:
    workflows:
      - "02 - SonarQube Code Analysis"
    types:
      - completed

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  deploy:
    name: Publish and Deploy
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          settings-path: ${{ github.workspace }}

      - name: Publish Maven package to GitHub Packages
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download JAR artifact from Pipeline 2
        uses: actions/download-artifact@v4
        with:
          name: java-app-jar
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy JAR to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            java-cicd-app-1.0.0.jar \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/java-ciccd-app-1.0.0.jar

          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
              sudo systemctl stop java-app || true
              sudo mv /tmp/java-cicd-app-1.0.0.jar /opt/java-app/java-ciccd-app-1.0.0.jar
              sudo chown ubuntu:ubuntu /opt/java-app/java-ciccd-app-1.0.0.jar
              sudo systemctl start java-app
              sudo systemctl status java-app --no-pager
          EOF

      - name: Verify application on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "curl -f http://localhost:8080"
